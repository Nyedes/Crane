<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Crane</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="tailwind-built.css"/>
    <style>
        body {
            width: 348px;
            overflow-x: hidden;
            background-color: #f7f9ff;
            font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .blueprint-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(9, 29, 46, 0.025) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(9, 29, 46, 0.025) 1px, transparent 1px);
            background-size: 16px 16px;
            z-index: 0;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #9e3d00;
            display: inline-block;
            flex-shrink: 0;
        }

        .status-dot.active {
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }

        .staircase-progress {
            border-left: 2px solid rgba(158, 61, 0, 0.16);
            margin-left: 8px;
        }
    </style>
</head>
<body class="font-body-md text-on-surface p-0 m-0 relative select-none">
    <div class="blueprint-grid"></div>

    <!-- Header Section -->
    <header class="bg-surface/95 backdrop-blur-md sticky top-0 z-50 flex justify-between items-center px-md h-14 w-full border-b border-on-surface/10 shadow-sm">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-on-primary shadow-sm">
                <!-- Tower Crane SVG Icon -->
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 21h9"/>
                    <path d="M7.5 21V4.5L9 3l1.5 1.5V21"/>
                    <path d="M3 6.5h17"/>
                    <path d="M9 3L4.5 6.5M9 3l7.5 3.5"/>
                    <path d="M17.5 6.5v6"/>
                    <rect x="15.5" y="12.5" width="4" height="3" rx="0.75" fill="currentColor"/>
                </svg>
            </div>
            <div>
                <h1 class="font-headline-md text-[17px] leading-tight font-extrabold text-primary tracking-tight">Crane</h1>
                <p class="font-label-caps text-[9px] text-on-surface-variant/70 uppercase tracking-wider leading-none">SkyscraperCity Opener</p>
            </div>
        </div>
        <button class="text-primary hover:bg-primary-container/10 transition-all p-2 rounded-lg active:scale-95" id="popupSettingsBtn" title="Open Rules Dashboard">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </header>

    <main class="px-md py-md space-y-md relative z-10">
        <!-- Hero Action Area -->
        <section class="space-y-2.5">
            <!-- Primary: Open Current Page Unread Links -->
            <button class="w-full py-3.5 px-md bg-primary text-on-primary rounded-xl shadow-md hover:bg-primary-container transition-all flex items-center justify-between gap-sm active:scale-[0.98] disabled:bg-surface-variant disabled:text-on-surface-variant disabled:pointer-events-none disabled:shadow-none group" id="openLinksBtn">
                <div class="flex items-center gap-3 text-left">
                    <div class="w-9 h-9 rounded-lg bg-white/15 flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                    </div>
                    <div>
                        <div class="font-button-text text-[14px] uppercase tracking-wider font-bold">Open Unread Links</div>
                        <div class="font-label-caps text-[11px] opacity-80" id="unreadCountLabel">Ready to Scan Page</div>
                    </div>
                </div>
                <svg class="w-4 h-4 opacity-75 group-hover:translate-x-0.5 transition-transform shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </button>

            <!-- Secondary Hero: Expand & Open All Hierarchy -->
            <button class="w-full py-3 px-md bg-secondary-container/20 hover:bg-secondary-container/35 border border-secondary-container/60 text-primary rounded-xl shadow-sm transition-all flex items-center justify-between gap-sm active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none group" id="expandAllBtn" title="Deep-scan unread subforums in your saved order and open all subforums + unread threads in hierarchy order">
                <div class="flex items-center gap-3 text-left overflow-hidden">
                    <div class="w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center shrink-0 text-primary">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="6" cy="6" r="2.5"/>
                            <circle cx="18" cy="6" r="2.5"/>
                            <circle cx="18" cy="18" r="2.5"/>
                            <path d="M8.5 6H15.5"/>
                            <path d="M6 8.5V14a4 4 0 0 0 4 4h5.5"/>
                        </svg>
                    </div>
                    <div class="overflow-hidden">
                        <div class="font-button-text text-[13px] uppercase tracking-wider font-bold text-primary">Expand &amp; Open All</div>
                        <div class="font-label-caps text-[10px] text-on-surface-variant/85 truncate" id="expandAllLabel">Open Subforums + Threads in Hierarchy</div>
                    </div>
                </div>
                <svg class="w-4 h-4 text-primary group-hover:translate-y-0.5 transition-transform shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="7 13 12 18 17 13"/>
                    <polyline points="7 6 12 11 17 6"/>
                </svg>
            </button>
        </section>

        <!-- Real-time Status Display -->
        <section class="bg-surface-container-low border border-on-surface/10 rounded-xl p-3.5 shadow-sm">
            <div class="flex items-center justify-between mb-2.5 border-b border-on-surface/10 pb-1.5">
                <h3 class="font-label-caps text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Execution Pipeline</h3>
                <span class="hidden px-2 py-0.5 rounded-full bg-secondary-container/30 text-primary text-[10px] font-label-caps font-bold" id="queueBadge"></span>
            </div>
            <div class="staircase-progress space-y-2.5" id="pipeline">
                <!-- Dynamically populated steps -->
            </div>
        </section>

        <!-- Contextual Rule Editor Button -->
        <section>
            <button class="w-full flex items-center justify-between px-3.5 py-2.5 bg-surface-container rounded-xl border border-on-surface/10 hover:bg-surface-container-high transition-all active:scale-[0.98] group disabled:opacity-40 disabled:pointer-events-none" id="addRuleForPage">
                <div class="flex items-center gap-2.5 text-on-secondary-container">
                    <svg class="w-4 h-4 text-secondary shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="21" x2="4" y2="14"/>
                        <line x1="4" y1="10" x2="4" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12" y2="3"/>
                        <line x1="20" y1="21" x2="20" y2="16"/>
                        <line x1="20" y1="12" x2="20" y2="3"/>
                        <line x1="1" y1="14" x2="7" y2="14"/>
                        <line x1="9" y1="8" x2="15" y2="8"/>
                        <line x1="17" y1="16" x2="23" y2="16"/>
                    </svg>
                    <span class="font-button-text text-[13px] text-secondary">Edit Rules for This Page</span>
                </div>
                <svg class="w-4 h-4 text-on-surface-variant group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </button>
        </section>

        <!-- Footer / Global Actions -->
        <footer class="flex items-center justify-between pt-2 border-t border-on-surface/10">
            <a class="font-label-caps text-[11px] font-semibold text-primary hover:underline flex items-center gap-1.5" href="options.html" id="configureAllRules">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
                Configure All Rules
            </a>
            <span class="font-label-caps text-[10px] text-on-surface-variant/60">Crane v2.5</span>
        </footer>
    </main>

    <script src="popup.js"></script>
</body>
</html>
